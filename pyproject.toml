[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elenchus"
version = "0.1.0"
description = "A claim isn't true because a model said it. Elenchus pairs any LLM claim with an independent adversarial verifier that tries to refute it before it's trusted — and measures, empirically, when that actually helps."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vincent Plessy", email = "vincent.plessy12@gmail.com" }]
keywords = ["llm", "verification", "evals", "agents", "reliability", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "anthropic>=0.92",
  "click>=8.1",
  "pydantic>=2.8",
  "rich>=13.7",
]

[project.scripts]
elenchus = "elenchus.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/elenchus"
Issues = "https://github.com/Vincent-P-essy/elenchus/issues"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/elenchus"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/elenchus"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["elenchus"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
